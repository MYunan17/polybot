version: "3.9"
services:
  mirofish:
    build:
      context: ./MiroFish
    container_name: mirofish
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./MiroFish/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
